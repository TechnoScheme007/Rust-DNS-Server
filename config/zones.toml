# Authoritative Zones Configuration
# Define zones that this DNS server is authoritative for.

[[zones]]
name = "example.local"

[zones.soa]
mname = "ns1.example.local"
rname = "admin.example.local"
serial = 2024010101
refresh = 3600
retry = 900
expire = 604800
minimum = 300

[[zones.records]]
name = "@"
type = "NS"
value = "ns1.example.local"

[[zones.records]]
name = "ns1"
type = "A"
value = "127.0.0.1"

[[zones.records]]
name = "@"
type = "A"
ttl = 300
value = "127.0.0.1"

[[zones.records]]
name = "www"
type = "CNAME"
ttl = 300
value = "example.local"

[[zones.records]]
name = "@"
type = "MX"
ttl = 300
value = "mail.example.local"
priority = 10

[[zones.records]]
name = "mail"
type = "A"
ttl = 300
value = "127.0.0.2"

[[zones.records]]
name = "@"
type = "TXT"
ttl = 300
value = "v=spf1 mx -all"

[[zones.records]]
name = "_sip._tcp"
type = "SRV"
ttl = 300
value = "sip.example.local"
priority = 10
weight = 60
port = 5060

[[zones.records]]
name = "@"
type = "AAAA"
ttl = 300
value = "::1"
