# DNS Server Configuration

# Address to listen on for DNS queries (UDP + TCP)
listen_addr = "127.0.0.1:53"

# Maximum number of cached DNS records
cache_size = 10000

# Enable DNSSEC validation
enable_dnssec = false

# Path to authoritative zones file (optional)
zones_file = "config/zones.toml"

# DNS-over-HTTPS configuration (optional)
[doh]
listen_addr = "127.0.0.1:8443"
# TLS certificate and key paths (optional - runs HTTP without TLS if omitted)
# tls_cert = "certs/cert.pem"
# tls_key = "certs/key.pem"
