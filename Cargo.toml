[package]
name = "dns-server"
version = "1.0.0"
edition = "2021"
description = "A recursive DNS resolver with caching, DNSSEC validation, authoritative zones, and DNS-over-HTTPS support"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
rand = "0.8"
lru = "0.12"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring = "0.17"
base64 = "0.22"
data-encoding = "2"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

[profile.release]
opt-level = 3
lto = true
